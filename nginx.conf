server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Application mobile : fichiers à télécharger (ex. /downloads/erh-camusat.apk), dossier ./downloads du serveur
    location ^~ /downloads/ {
        alias /usr/share/nginx/downloads/;
        types { application/vnd.android.package-archive apk; }
        add_header Content-Disposition "attachment";
        # Jamais mis en cache (ni navigateur ni Cloudflare), y compris une réponse « introuvable »
        add_header Cache-Control "no-store, max-age=0" always;
    }

    # Assets statiques : cache long (les noms contiennent un hash Vite)
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy API → backend Django (évite le Mixed Content HTTPS→HTTP)
    location /api/ {
        proxy_pass         http://192.168.1.50:8030;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA : toutes les routes → index.html
    location / {
        # index.html jamais mis en cache : après un déploiement, le navigateur charge la nouvelle version
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
