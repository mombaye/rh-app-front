services:
  frontend:
    build:
      context: .
      args:
        VITE_API_URL: ""
        VITE_PUBLIC_URL: https://erh.camusatsn.com
    image: erh-frontend:latest
    container_name: erh-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # APK de l'application mobile : déposer le fichier dans ./downloads/ (non versionné)
      - ./downloads:/usr/share/nginx/downloads:ro
